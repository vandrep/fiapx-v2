# O id do job abaixo (`build`) e chave de configuracao remota, nao prosa: o ruleset da
# `main` o exige como status check. Renomear aqui trava todo PR do repositorio, sem aviso.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # PR cancela run antigo a vontade. `main` nunca: um run cancelado no meio deixaria as
  # imagens sem publicar e o `latest` apontando para um commit anterior, silenciosamente.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # O default do repo e `read`; o push para o GHCR precisa disto. Nenhum segredo novo:
      # o GITHUB_TOKEN autentica no registry sozinho.
      packages: write
    env:
      PUBLICA: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # A demo roda na maquina do avaliador, que pode ser Apple Silicon -- e ffmpeg sob
      # emulacao inviabiliza a Extracao. Publicar arm64 e barato aqui: os Dockerfiles so
      # copiam um quarkus-app ja pronto, que e Java puro. Em PR basta amd64: o que quebra
      # num Dockerfile quebra igual nas duas arquiteturas.
      PLATAFORMAS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A partir da raiz, sempre. `mvn -f <servico>/pom.xml` tira o agregador do reator e
      # pula em silencio a guarda das tres copias de ArchitectureConstraintsTest, que esta
      # presa a fase `validate` dele. Ver AGENTS.md.
      #
      # Nao existe *IT.java neste projeto: os testes integrados sao @QuarkusTest no
      # surefire, que sobem Dev Services por Testcontainers -- o runner tem Docker.
      - name: Verify
        run: ./mvnw --batch-mode verify

      - uses: docker/setup-qemu-action@v3
        if: env.PUBLICA == 'true'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLICA == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # As tres imagens saem da mesma compilacao Maven que acabou de rodar: os Dockerfiles
      # sao single-stage sobre o target/quarkus-app deste runner. Por isso nao ha job
      # separado -- transferir tres quarkus-app por artifact nao compraria nada.
      #
      # provenance: false mantem a listagem do package limpa; o attestation da OCI acrescenta
      # entradas "unknown/unknown" que confundem quem for so puxar a imagem.
      - name: Imagem videos
        uses: docker/build-push-action@v6
        with:
          context: videos
          platforms: ${{ env.PLATAFORMAS }}
          push: ${{ env.PUBLICA }}
          provenance: false
          tags: |
            ghcr.io/vandrep/fiapx-videos:${{ github.sha }}
            ghcr.io/vandrep/fiapx-videos:latest

      - name: Imagem extracao
        uses: docker/build-push-action@v6
        with:
          context: extracao
          platforms: ${{ env.PLATAFORMAS }}
          push: ${{ env.PUBLICA }}
          provenance: false
          tags: |
            ghcr.io/vandrep/fiapx-extracao:${{ github.sha }}
            ghcr.io/vandrep/fiapx-extracao:latest

      - name: Imagem notificacao
        uses: docker/build-push-action@v6
        with:
          context: notificacao
          platforms: ${{ env.PLATAFORMAS }}
          push: ${{ env.PUBLICA }}
          provenance: false
          tags: |
            ghcr.io/vandrep/fiapx-notificacao:${{ github.sha }}
            ghcr.io/vandrep/fiapx-notificacao:latest
