# Overlay de experimento (ticket 025). Nao substitui o `docker-compose.yml` — soma-se a ele:
#
#   docker compose -f docker-compose.yml -f docker-compose.carga.yml up -d
#
# O `docker-compose.yml` principal **e a demo da banca**, e por isso nao recebe limite de CPU
# nem replica da borda: sao parametros que existem so para o experimento, e deixa-los la faria
# a demo carregar o instrumento para sempre. Overlay e a construcao que o proprio Compose
# oferece para esta separacao.
#
# Uma excecao, desde o ticket 049: o `extracao` da demo sobe com `replicas: 2`, porque
# processar mais de um video ao mesmo tempo e requisito do enunciado, nao instrumento de
# medicao. O que continua morando so aqui e o N variavel e o teto de CPU por replica.
#
# As duas variaveis abaixo sao o parametro que o ticket 026 varre. O 025 fixa
# FIAPX_EXTRACAO_REPLICAS=4 para a drenagem da rajada nao levar meia hora; o 026 percorre
# N em {1,2,4,6} com o mesmo teto de CPU por replica.
#
# `videos` e `videos-proxy` sao do ticket 028: escalar a borda por replicas exige um proxy na
# frente, porque a porta publicada (`8080:8080`) nao pode ser aberta por N containers ao mesmo
# tempo. `!override []` some com a publicacao de porta do `videos` so aqui — o
# `docker-compose.yml` principal, que e a demo, continua publicando a porta como sempre porque
# no `videos` dele `deploy.replicas` nunca aparece (nasce implicitamente em 1). O `extracao`
# escala na demo sem essa complicacao justamente por nao publicar porta nenhuma.
services:
  # A observabilidade sai do experimento (ticket 058). E a mesma logica do cabecalho deste
  # arquivo, invertida: se a demo nao deve carregar o instrumento para sempre, o experimento
  # tambem nao deve carregar a demo.
  #
  # O motivo nao e purismo. Os numeros que o mapa registra — 15,6 Video/min, eficiencia 0,88 e
  # 0,99, mediana do 202, 0 presos em 400 — foram medidos SEM esta stack, e o que eles medem e
  # escalabilidade limitada por CPU, com teto de CPU por replica justamente para isolar o
  # desenho do host. Um coletor disputando o mesmo host mede outra coisa, e as quatro medicoes
  # dos tickets 025-028 deixariam de ser comparaveis com qualquer corrida futura.
  #
  # `replicas: 0` e nao `profiles`: com replicas zero, uma stack que ja estava de pe e reduzida
  # a zero pelo `up` do overlay. Com profile, um container ja rodando continuaria rodando — e a
  # garantia que este bloco precisa dar e sobre a corrida, nao sobre a intencao.
  #
  # O preco disto e uma configuracao medida que nao e a configuracao entregue, e ele esta
  # registrado em `docs/arquitetura.md` § Limitacoes conhecidas. O que fecha o buraco e o
  # numero de sobrecarga medido uma vez sobre o fixture de controle, no ticket 058, em vez de
  # varrer N de novo.
  observabilidade:
    deploy:
      replicas: 0

  # O SDK dos tres servicos desligado, pelo mesmo motivo e no mesmo movimento (ticket 059).
  # Desligar so a stack deixaria os tres exportando para um endereco morto: cada um pagaria o
  # custo de instrumentar — span, histograma, batch de log — e ainda o de um exportador
  # tentando e falhando durante a rajada inteira. O que o overlay preserva e o metodo das
  # medicoes dos tickets 025-028, e elas foram feitas com codigo que nao instrumentava nada.
  #
  # `QUARKUS_OTEL_SDK_DISABLED`, e nao um override de canal ou de perfil: e a chave que o
  # proprio Quarkus expoe para "nao instrumente", e ela desliga os tres sinais de uma vez.
  # Override de Compose por variavel de ambiente e deliberado e revisado junto do arquivo que
  # o declara — a ressalva que o AGENTS.md faz sobre o limite do teste arquitetural.
  extracao:
    environment:
      # Ticket 029, modo `mata-publicacao`: sobrescreve o canal de saida `extracao-falhou`
      # para apontar a uma exchange inexistente sem declara-la, forcando a falha de
      # publicacao que aquele modo mede.
      #
      # Variaveis proprias, resolvidas pelo application.properties (ticket 038):
      # MP_MESSAGING_* transforma extracao-falhou em extracao.falhou na enumeracao
      # e inventa um canal extracao sem connector, derrubando o boot.
      - FIAPX_EXTRACAO_FALHOU_EXCHANGE_NAME
      - FIAPX_EXTRACAO_FALHOU_EXCHANGE_DECLARE
      - QUARKUS_OTEL_SDK_DISABLED=true
    deploy:
      replicas: ${FIAPX_EXTRACAO_REPLICAS:-4}
      resources:
        limits:
          # Teto por replica, e nao por servico: sem ele, "dobrar replicas" num host de 20
          # cores nao dobra nada — mede-se o host, nao o desenho. `cpus` como string porque
          # o Compose exige (aceita fracionario).
          cpus: "${FIAPX_EXTRACAO_CPUS:-2}"

  videos:
    environment:
      QUARKUS_OTEL_SDK_DISABLED: "true"
    ports: !override []
    deploy:
      replicas: ${FIAPX_VIDEOS_REPLICAS:-1}

  # So aparece neste overlay por causa do SDK: o `notificacao` nao tem parametro de
  # experimento nenhum, mas nao pode ser o unico dos tres a continuar instrumentado durante a
  # medicao.
  notificacao:
    environment:
      QUARKUS_OTEL_SDK_DISABLED: "true"

  # So existe neste overlay — a demo da banca fala com o `videos` direto. O entrypoint gera o
  # nginx.conf em runtime porque o numero de replicas so existe em runtime: ver
  # scripts/carga/proxy/entrypoint.sh para o porque de nao dar para usar upstream estatico.
  videos-proxy:
    image: nginx:1.27-alpine
    environment:
      FIAPX_VIDEOS_REPLICAS: ${FIAPX_VIDEOS_REPLICAS:-1}
      # Precisa bater com o nome de projeto que o Compose usou de fato — o harness passa o
      # mesmo valor usado para montar o nome da rede (`$(basename "$raiz")`), nunca um default
      # deste arquivo, porque o nome de projeto real depende de onde o repo foi clonado.
      FIAPX_PROXY_PROJETO: ${COMPOSE_PROJECT_NAME:?defina COMPOSE_PROJECT_NAME}
    volumes:
      - ./scripts/carga/proxy/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "8080:8080"
    depends_on:
      - videos
    healthcheck:
      # Bate no proprio caminho sob medicao: sobe uma replica do videos por tras do proxy, nao
      # so o proxy isolado. 127.0.0.1, nao localhost: a imagem nginx:alpine resolve "localhost"
      # para ::1 primeiro, e o nginx aqui so escuta em IPv4 (`listen 8080` sem `[::]`) — com
      # "localhost" o wget do healthcheck batia em ::1 e ficava "unhealthy" para sempre mesmo
      # com o proxy respondendo normal em 127.0.0.1. Achado ao rodar (ticket 028).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
