# Orquestracao dos cinco servicos do FIAP X (ticket 020). Rede e hostnames sao os default do
# Compose (um projeto = uma rede, nome do servico = hostname), ja assumidos pela config de
# cada servico (`rabbitmq`, `minio`, `keycloak`, `mailhog`, `postgres`).
#
# As imagens dos tres servicos de negocio vem prontas do GHCR (ticket 013) — nao ha `build:`
# aqui, `target/` esta fora do repo. `docker compose pull` antes do `up` traz o `latest`.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fiapx_videos
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
    volumes:
      - fiapx-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx_videos"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    # O nome do no faz parte da identidade dos dados persistidos (ticket 044).
    hostname: rabbitmq
    volumes:
      - fiapx-rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/conf.d/10-definitions.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - fiapx-minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: cria os buckets `videos`/`pacotes` e a regra de retencao de 7 dias
  # (ticket 011). Os tres servicos de negocio so sobem depois dele terminar.
  minio-seed:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "/seed.sh"]
    volumes:
      - ./docker/minio/seed.sh:/seed.sh:ro

  # start-dev: destino e demo via Compose, nao hardening de producao — start productizado
  # exigiria KC_HOSTNAME/TLS sem plateia para justificar o trabalho.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Fixa o issuer em keycloak:8080 (o hostname interno que o `videos` valida),
      # independente do host:porta que o cliente externo usou para pedir o token — sem
      # isto o Host header do curl/browser (localhost:8081) viraria o issuer, e o `videos`
      # rejeitaria como emissor desconhecido.
      KC_HOSTNAME: http://keycloak:8080
    volumes:
      # Preserva usuarios e seus `sub`: Videos continuam pertencendo ao mesmo dono
      # depois de down/up (ticket 044).
      - fiapx-keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      # A imagem nao traz curl nem wget (base RHEL minima): /dev/tcp e o truque documentado
      # pelo proprio Keycloak. Health e metrics vivem na porta de management 9000, nao na 8080.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v2/messages"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Camada de observabilidade (ticket 058, destino redesenhado em 06/09/2026). Um container
  # so, com Collector + Prometheus + Tempo + Loki + Grafana. Cinco pecas separadas dariam a
  # mesma coisa por cinco vezes o YAML e a RAM; o custo desta escolha e que a imagem e
  # declaradamente de DEMONSTRACAO, nao de producao — o que casa com um destino que e uma demo
  # em Compose, e esta escrito em `docs/arquitetura.md` § Limitacoes conhecidas.
  #
  # TRES propriedades que este bloco garante, e que sao o ponto do ticket:
  #
  #   1. Nenhum servico de negocio tem `depends_on` para ca, e nada aqui entra no caminho de
  #      boot deles. Observabilidade que derruba o sistema observado troca uma camada de
  #      diagnostico por uma causa nova de indisponibilidade. O `smoke.sh` prova isso
  #      derrubando este container e verificando que o ciclo do Video continua inteiro.
  #   2. Sem volume nomeado, de proposito: a retencao e efemera e o historico morre no `down`.
  #      Volume sem teto na maquina de quem avalia e pior que perder historico — e o valor
  #      forense aqui dura o que durar o `up`.
  #   3. So a porta do Grafana (3000) e publicada. As de Prometheus (9090), Tempo (3200) e
  #      OTLP (4317/4318) ficam so na rede do Compose: quem consulta e o Grafana, e os
  #      servicos exportam por dentro.
  #
  # Sem credencial na tabela do README porque a imagem sobe o Grafana com acesso anonimo e
  # papel Admin (`GF_AUTH_ANONYMOUS_ENABLED` default `true` no `run-grafana.sh` dela). Escrever
  # configuracao de autenticacao para uma stack efemera de demonstracao seria custo sem
  # comprador — e cada segundo de login sai do orcamento de 10 minutos do video.
  observabilidade:
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "3000:3000"
    volumes:
      - ./docker/observabilidade/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      # O Grafana desta imagem roda com cwd em `/otel-lgtm/grafana` e le provisionamento
      # relativo a ele — nao em `/data/grafana`, que so guarda dados e plugins.
      - ./docker/observabilidade/alertas.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/alertas.yaml:ro
      # O painel do ticket 092 custa DOIS mounts, e nao um: `provisioning/dashboards/` guarda
      # PROVIDERS, nao dashboards — um JSON solto ali e ignorado. O provider aponta para o
      # subdiretorio `fiapx/`, onde o JSON entra.
      - ./docker/observabilidade/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dashboards.yaml:ro
      - ./docker/observabilidade/painel-infraestrutura.json:/otel-lgtm/grafana/conf/provisioning/dashboards/fiapx/painel-infraestrutura.json:ro
    environment:
      # Sem isto o painel e mais um item numa lista de quatro, e quem abre localhost:3000 cai
      # na home de fabrica do Grafana — ou abre o RED por engano. O caminho e o do arquivo
      # montado acima, e nao o uid: esta variavel le dashboard do disco.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/fiapx/painel-infraestrutura.json
    # `test -f /tmp/ready`, e nao um `wget` na porta do Grafana: a imagem nao traz `wget` nem
    # `curl`, e cria `/tmp/ready` quando as cinco pecas terminaram de subir — e a marca de
    # prontidao que ela propria publica, e cobre o conjunto, nao so o Grafana.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  videos:
    image: ghcr.io/vandrep/fiapx-videos:latest
    environment:
      QUARKUS_DATASOURCE_USERNAME: fiapx
      QUARKUS_DATASOURCE_PASSWORD: fiapx
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/fiapx_videos
      RABBITMQ_USERNAME: fiapx
      RABBITMQ_PASSWORD: fiapx
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # `auth-server-url` (issuer, validado pelo backend) fica em keycloak:8080 — inalcancavel
      # de fora do Compose. O botao Authorize do Swagger roda no browser do avaliador, que so
      # enxerga a porta publicada; por isso o token-url precisa ser um valor diferente do
      # issuer, coisa que so um override em runtime (ConfigProvider, nao build-time) permite.
      FIAPX_OPENAPI_TOKEN_URL: http://localhost:8081/realms/fiapx/protocol/openid-connect/token
    volumes:
      - fiapx-uploads:/var/fiapx/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  extracao:
    image: ghcr.io/vandrep/fiapx-extracao:latest
    environment:
      RABBITMQ_USERNAME: fiapx
      RABBITMQ_PASSWORD: fiapx
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - fiapx-extracao-scratch:/var/fiapx/extracao
    # Duas replicas, e nao uma (ticket 049). O primeiro requisito do enunciado e processar
    # mais de um video ao mesmo tempo, e ate aqui a demo o exercia com uma replica so e
    # `max-outstanding-messages=1` — um video por vez, concorrencia so no overlay de carga,
    # que e instrumento de medicao e nao a stack que o README manda subir.
    #
    # Por replicas, e nao por mensagens em voo: o prefetch=1 do `extracao` protege memoria e
    # disco (o ticket 006 mediu ate 4,4 GB de PNG numa unica Extracao), e subi-lo poria N
    # extracoes dentro do MESMO JVM e do mesmo scratch. Competing consumers da a mesma
    # concorrencia sem tocar nessa garantia: cada replica continua pegando uma Extracao por
    # vez. E o desenho que `docs/arquitetura.md` § Escalar ja descrevia — o que faltava era a
    # demo exerce-lo.
    #
    # Duas e o menor N que demonstra o requisito, e o ponto medido com eficiencia de escala
    # 0,99 (ticket 026, 2,96 -> 5,87 Video/min). Para ver mais, a mesma variavel que o overlay
    # de carga ja usava: `FIAPX_EXTRACAO_REPLICAS=4 docker compose up -d`.
    #
    # Duas coisas MUDAM com a replica extra, e nenhuma delas e o que o prefetch protegia
    # (ticket 049, condicao 3):
    #
    #   1. O `fiapx-extracao-scratch` e um volume so, montado nas duas: o pior caso de disco
    #      da demo dobra, de 4,4 GB para 8,8 GB. E o preco do desenho — o ticket 041 ja deu a
    #      cada TENTATIVA o seu diretorio dentro dele exatamente porque as replicas dividem o
    #      volume, e a varredura de orfaos com gate por idade (ticket 027) tambem nasceu ali.
    #   2. Sem teto de CPU, cada replica dimensiona o `ffmpeg` por `availableProcessors()`,
    #      que sem cgroup devolve o host inteiro — as duas se sobre-assinam. O 0,99 do
    #      ticket 026 foi medido COM `cpus=2` por replica; na demo sem teto ele nao se
    #      transfere. Aceitavel aqui porque a demo mede requisito, nao vazao: o que ela tem de
    #      mostrar e que dois Videos sao extraidos ao mesmo tempo. Teto de CPU continua so no
    #      overlay, que e onde se mede.
    deploy:
      replicas: ${FIAPX_EXTRACAO_REPLICAS:-2}
    # O terceiro dos tres numeros do ticket 035, e o unico que mora fora do JVM. O
    # DrenoDaExtracao segura o desligamento por ate `fiapx.extracao.dreno-timeout-segundos`
    # (420s) esperando a Extracao em voo terminar e dar ack, para o deploy nao gastar uma das
    # tres entregas de `extracao.extrair`. O default do Docker aqui e 10s — SIGKILL bem no
    # meio do dreno, que e o pior dos dois mundos: nao poupa entrega e ainda atrasa o deploy.
    # 480 > 420 de proposito, para o JVM sempre ganhar essa corrida.
    #
    # Nao e o custo tipico de um deploy: o dreno libera no ack, entao o que se paga e o que
    # sobra da Extracao em voo (segundos, no fixture de controle). 480 e so o teto — medido em
    # scripts/carga/conservacao.sh, modo `redeploy-extracao`.
    stop_grace_period: 480s
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  notificacao:
    image: ghcr.io/vandrep/fiapx-notificacao:latest
    environment:
      RABBITMQ_USERNAME: fiapx
      RABBITMQ_PASSWORD: fiapx
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fiapx-postgres-data:
  fiapx-rabbitmq-data:
  fiapx-keycloak-data:
  fiapx-minio-data:
  fiapx-uploads:
  fiapx-extracao-scratch:
