# Config do coletor da stack de observabilidade (ticket 058).
#
# DERIVADA de `/otel-lgtm/otelcol-config.yaml` da imagem `grafana/otel-lgtm:0.32.1`, com DUAS
# adicoes: o receiver `prometheus/rabbitmq` (ticket 058) e o processador `transform/instancia`
# (tickets 091, 095 e 096). A imagem nao oferece mecanismo de inclusao, so substituicao do
# arquivo inteiro — entao subir a versao da imagem exige rederivar este arquivo e reaplicar as DUAS adicoes,
# conferindo o diff, do mesmo jeito que o ticket 035 fez com os campos privados do SmallRye. O
# `docker-compose.yml` fixa a versao justamente para que isso nao aconteca sozinho.
#
# O broker e raspado em `/metrics/detailed`, e nao no `/metrics` padrao: o padrao devolve
# metrica AGREGADA, sem rotulo de fila, e os tres alertas do ticket 058 sao todos por fila
# ("o Estacionamento esta vazio?", "a DLQ tem mensagem?", "esta fila tem consumidor?"). As duas
# familias pedidas sao o minimo que responde as tres perguntas — pedir todas encheria o
# Prometheus de serie que ninguem consulta.
receivers:
  prometheus/rabbitmq:
    config:
      scrape_configs:
        - job_name: "rabbitmq"
          scrape_interval: 15s
          metrics_path: /metrics/detailed
          params:
            family:
              - queue_coarse_metrics
              - queue_consumer_count
          static_configs:
            - targets: ["rabbitmq:15692"]
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  # SEGUNDA adicao (ticket 091): da `service.instance.id` as series que chegam por OTLP.
  # Quem traduz OTLP->Prometheus e o proprio Prometheus, em /api/v1/otlp, e ele mapeia
  # service.name->job e service.instance.id->instance. Sem o segundo, as series dos tres
  # servicos ficam SEM a etiqueta `instance`, e os tres dashboards de fabrica da imagem
  # filtram TODA query por instance=~".+" (o allValue das variaveis), que exige a etiqueta
  # existir e nao ser vazia — entao eles respondiam "No data" sobre um sistema saudavel.
  # host.name ja esta em toda serie e e o id do container: UNICO POR REPLICA, que e a
  # condicao que o `extracao` impoe por subir com duas replicas, e nao uma.
  #
  # A guarda `== nil` preserva quem ja traz a sua: as series de scrape do `rabbitmq` e do
  # `otelcol-contrib` setam `instance` nativamente, e nao podem ser reescritas.
  #
  # O valor e `<service.name>-<replica>` (`fiapx-extracao-2`), e nao o id do container: as
  # legendas do *JVM Overview* so mostram a `instance` — a maioria das queries agrega
  # `by (instance)` e descarta o `job` —, e o id nao diz nem de qual servico a linha e
  # (ticket 095) nem qual replica ela e (ticket 096). O numero da replica e o sufixo do
  # `container.name` que o `entrypoint.sh` de cada imagem declara (`fiapx-v2-extracao-2`);
  # o prefixo e o nome do projeto Compose, que muda com o diretorio, por isso so o numero
  # e aproveitado. Continua UNICO POR REPLICA, que e o que o `extracao` exige — mas nao por
  # container: um container RECRIADO herda a `instance` do anterior, e por ~5 min (o lookback
  # do Prometheus) as duas geracoes somam nos paineis que agregam `by (instance)`. Custo aceito
  # no ticket 096; qualquer coisa que separe as geracoes teria de estar na legenda.
  #
  # O segundo statement e o recuo para quem nao declara `container.name` — imagem antiga, ou
  # fora do Compose —: `<service.name>/<host.name>`, feio mas unico. Sem ele a serie ficaria
  # sem `instance` e voltaria a sumir dos dashboards (ticket 091).
  transform/instancia:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(cache["replica"], ExtractPatterns(attributes["container.name"], "-(?P<replica>[0-9]+)$")["replica"]) where attributes["container.name"] != nil
          - set(attributes["service.instance.id"], Concat([attributes["service.name"], cache["replica"]], "-")) where attributes["service.instance.id"] == nil and attributes["service.name"] != nil and cache["replica"] != nil
          - set(attributes["service.instance.id"], Concat([attributes["service.name"], attributes["host.name"]], "/")) where attributes["service.instance.id"] == nil and attributes["service.name"] != nil and attributes["host.name"] != nil

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector, prometheus/rabbitmq]
      processors: [transform/instancia, batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
