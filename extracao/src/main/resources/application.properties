quarkus.application.name=fiapx-extracao

# Porta distinta por servico para rodar os tres em dev local. Sem borda HTTP publica, so o
# health check responde aqui.
%dev.quarkus.http.port=8082

# Teto de duracao do ticket 011: acima disso, DURACAO_EXCEDIDA, falha permanente. O ffprobe
# ja roda para conferir a contagem de frames — a duracao sai de graca.
fiapx.extracao.teto-duracao-minutos=20
fiapx.extracao.timeout-ffprobe-segundos=30
fiapx.extracao.timeout-ffmpeg-segundos=300

# Scratch por Video (ticket 011): apagado-e-recriado por tentativa, limpo em finally, e
# varrido no boot para orfaos de crash. Sobre o volume nomeado fiapx-extracao-scratch, 4 GB.
# A varredura de boot so toca o que esta ocioso ha mais que este limiar: o volume e
# compartilhado por todas as replicas, e sem o gate o boot de uma apagava o scratch das
# outras por baixo do ffmpeg (ticket 027, defeito 3). Uma hora e folga larga sobre o teto de
# duracao de 20 min e sobre o timeout de ffmpeg de 300 s.
fiapx.extracao.idade-minima-do-orfao-minutos=60
%prod.fiapx.extracao.scratch-raiz=/var/fiapx/extracao
%dev.fiapx.extracao.scratch-raiz=${java.io.tmpdir}/fiapx-extracao-dev
%test.fiapx.extracao.scratch-raiz=${java.io.tmpdir}/fiapx-extracao-test

# Dois buckets, e nao um com prefixos (ticket 011). O `extracao` nao conhece a convencao de
# chave — so le e grava onde a mensagem mandar, mas precisa saber em qual bucket.
fiapx.armazenamento.bucket-videos=videos
fiapx.armazenamento.bucket-pacotes=pacotes

# MinIO exige path-style: o virtual-host style da AWS pediria DNS por bucket.
quarkus.s3.path-style-access=true
quarkus.s3.async-client.type=netty
%prod.quarkus.s3.endpoint-override=http://minio:9000
%prod.quarkus.s3.aws.region=us-east-1
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}

# O Dev Service da extensao S3 sobe LocalStack, nao MinIO (ticket 005).
%test.quarkus.s3.devservices.buckets=videos,pacotes

# Mensageria (docs/contratos/mensagens.md, ticket 015). Topologia inteira pelos canais: o
# definitions.json do Compose so carrega o que nao e queue argument.
%prod.rabbitmq-host=rabbitmq
%prod.rabbitmq-port=5672
%prod.rabbitmq-username=${RABBITMQ_USERNAME:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Fixado nos Dev Services e no Compose (cartografia do mapa).
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.3.5-management-alpine

# extracao.extrair: fila quorum, x-delivery-limit=3, prefetch=1 (o ticket 006 mediu ate
# 4,4 GB de PNG numa unica Extracao — 1 mensagem em voo por vez). DLQ dedicada, nao
# compartilhada: e a unica DLQ do contrato que tem consumidor (docs/contratos/mensagens.md).
# dead-letter-queue-type/dead-letter-dlx/dead-letter-dlx-routing-key abaixo configuram a
# propria extracao.extrair.dlq (nao esta fila): a partir do ticket 029 ela deixa de ser
# terminal, ganha tipo quorum e um DLX proprio para o fundo dela — ver canal
# extrair-video-dlq, logo abaixo.
mp.messaging.incoming.extrair-video.connector=smallrye-rabbitmq
mp.messaging.incoming.extrair-video.exchange.name=fiapx.comandos
mp.messaging.incoming.extrair-video.exchange.type=topic
mp.messaging.incoming.extrair-video.queue.name=extracao.extrair
mp.messaging.incoming.extrair-video.routing-keys=extracao.extrair
mp.messaging.incoming.extrair-video.max-outstanding-messages=1
mp.messaging.incoming.extrair-video.failure-strategy=requeue
mp.messaging.incoming.extrair-video.queue.x-queue-type=quorum
mp.messaging.incoming.extrair-video.queue.x-delivery-limit=3
mp.messaging.incoming.extrair-video.auto-bind-dlq=true
mp.messaging.incoming.extrair-video.dlx.declare=true
mp.messaging.incoming.extrair-video.dead-letter-exchange=extracao.dlx
mp.messaging.incoming.extrair-video.dead-letter-queue-name=extracao.extrair.dlq
mp.messaging.incoming.extrair-video.dead-letter-queue-type=quorum
mp.messaging.incoming.extrair-video.dead-letter-dlx=extracao.dlx
mp.messaging.incoming.extrair-video.dead-letter-dlx-routing-key=extracao.extrair.estacionado

# Consumidor da propria DLQ (docs/contratos/mensagens.md § Dead-letter queues, ticket 029):
# sem ele o Video trava em PROCESSANDO. exchange.name="" (o exchange padrao do broker) evita
# que este canal declare ou faca bind a um exchange proprio — ele so consome a fila que o
# canal acima ja declara via auto-bind-dlq. queue.declare continua true (default) de
# proposito: os dois canais continuam declarando a extracao.extrair.dlq, e os argumentos
# batem — x-queue-type=quorum, x-dead-letter-exchange=extracao.dlx e
# x-dead-letter-routing-key=extracao.extrair.estacionado em ambos —, entao a redeclaracao e
# idempotente e o boot nao depende de qual dos dois sobe primeiro.
#
# failure-strategy=reject, nao mais requeue: esta DLQ ganhou fundo proprio, a
# extracao.extrair.estacionamento, que o auto-bind-dlq abaixo declara e liga a extracao.dlx
# (reusada, ja declarada por dlx.declare no canal acima) na chave
# extracao.extrair.estacionado. Com reject o nack sai com requeue=false e a mensagem cai no
# DLX na primeira falha — sem x-delivery-limit aqui, de proposito: um salto e tudo que uma
# DLQ de publicacao precisa, e o limite de 20 que o RabbitMQ 4.x aplica por default a fila
# quorum vira segunda linha de defesa que nunca dispara.
#
# extracao.extrair.estacionamento e quorum, nao classic: o ADR 0001 recusou classic porque o
# dead-lettering delas e at-most-once, e o estacionamento carrega a mensagem que menos pode
# sumir — a falha definitiva. Sem consumidor, e fim de linha: intervencao humana pelo
# management UI, igual a videos.dlq e notificacao.dlq. O Video correspondente continua preso
# em PROCESSANDO — o que muda e que o preso fica visivel, nao mais invisivel.
#
# Migracao: numa extracao.extrair.dlq ja existente como classic, esta versao leva 406
# PRECONDITION_FAILED no boot — x-queue-type e argumento de declaracao. Apague a fila
# (management UI ou volume limpo do RabbitMQ) antes de subir; ela descarta o que estiver
# dentro. Renomear em vez de apagar deixaria uma fila orfa com mensagens reais e ninguem
# olhando, que e o defeito que este ticket existe para remover.
mp.messaging.incoming.extrair-video-dlq.connector=smallrye-rabbitmq
mp.messaging.incoming.extrair-video-dlq.queue.name=extracao.extrair.dlq
mp.messaging.incoming.extrair-video-dlq.exchange.name=""
mp.messaging.incoming.extrair-video-dlq.max-outstanding-messages=1
mp.messaging.incoming.extrair-video-dlq.failure-strategy=reject
mp.messaging.incoming.extrair-video-dlq.queue.x-queue-type=quorum
mp.messaging.incoming.extrair-video-dlq.auto-bind-dlq=true
mp.messaging.incoming.extrair-video-dlq.dlx.declare=true
mp.messaging.incoming.extrair-video-dlq.dead-letter-exchange=extracao.dlx
mp.messaging.incoming.extrair-video-dlq.dead-letter-routing-key=extracao.extrair.estacionado
mp.messaging.incoming.extrair-video-dlq.dead-letter-queue-name=extracao.extrair.estacionamento
mp.messaging.incoming.extrair-video-dlq.dead-letter-queue-type=quorum

# publish-confirms=true nos tres canais de saida (ticket 029): sem ele o Uni do envio
# completa quando o byte sai no socket, nao quando o broker aceita — se o broker recusar a
# publicacao (exchange ausente, x-max-length estourado), o send completa com sucesso mesmo
# assim, o consumidor da DLQ da ack, e a mensagem some em silencio, sem circular e sem
# reentrega. Custa um round-trip ao broker por publicacao; e o preco de nao perder a falha
# definitiva.
mp.messaging.outgoing.extracao-iniciada.connector=smallrye-rabbitmq
mp.messaging.outgoing.extracao-iniciada.exchange.name=fiapx.eventos
mp.messaging.outgoing.extracao-iniciada.exchange.type=topic
mp.messaging.outgoing.extracao-iniciada.default-routing-key=extracao.iniciada
mp.messaging.outgoing.extracao-iniciada.publish-confirms=true

mp.messaging.outgoing.extracao-concluida.connector=smallrye-rabbitmq
mp.messaging.outgoing.extracao-concluida.exchange.name=fiapx.eventos
mp.messaging.outgoing.extracao-concluida.exchange.type=topic
mp.messaging.outgoing.extracao-concluida.default-routing-key=extracao.concluida
mp.messaging.outgoing.extracao-concluida.publish-confirms=true

mp.messaging.outgoing.extracao-falhou.connector=smallrye-rabbitmq
mp.messaging.outgoing.extracao-falhou.exchange.name=fiapx.eventos
mp.messaging.outgoing.extracao-falhou.exchange.type=topic
mp.messaging.outgoing.extracao-falhou.default-routing-key=extracao.falhou
mp.messaging.outgoing.extracao-falhou.publish-confirms=true
