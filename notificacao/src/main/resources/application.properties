quarkus.application.name=fiapx-notificacao

# Este servico nao tem banco: so `videos` e dono de estado (AGENTS.md).

# Porta distinta por servico para rodar os tres em dev local. Sem borda HTTP publica, so o
# health check responde aqui.
%dev.quarkus.http.port=8083

# quarkus-mailer mocka o envio fora de %prod por padrao (io.quarkus.mailer.MockMailbox) —
# so a linha de %prod precisa apontar para o MailHog do Compose.
quarkus.mailer.from=nao-responda@fiapx.com.br
%prod.quarkus.mailer.host=mailhog
%prod.quarkus.mailer.port=1025
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.start-tls=DISABLED

# Mensageria (docs/contratos/mensagens.md, ticket 014). Topologia inteira pelo canal: o
# definitions.json do Compose so carrega o que nao e queue argument.
%prod.rabbitmq-host=rabbitmq
%prod.rabbitmq-port=5672
%prod.rabbitmq-username=${RABBITMQ_USERNAME:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Fixado nos Dev Services e no Compose (cartografia do mapa).
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.3.5-management-alpine

# video-falhou: fila quorum, x-delivery-limit=3, prefetch=10 (uma chamada SMTP por mensagem,
# docs/contratos/mensagens.md § Prefetch). DLQ notificacao.dlq e terminal: sem consumidor,
# intervencao humana pelo management UI (ADR 0001).
mp.messaging.incoming.video-falhou.connector=smallrye-rabbitmq
mp.messaging.incoming.video-falhou.exchange.name=fiapx.eventos
mp.messaging.incoming.video-falhou.exchange.type=topic
mp.messaging.incoming.video-falhou.queue.name=notificacao.video-falhou
mp.messaging.incoming.video-falhou.routing-keys=video.falhou
mp.messaging.incoming.video-falhou.max-outstanding-messages=10
mp.messaging.incoming.video-falhou.failure-strategy=requeue
mp.messaging.incoming.video-falhou.queue.x-queue-type=quorum
mp.messaging.incoming.video-falhou.queue.x-delivery-limit=3
mp.messaging.incoming.video-falhou.auto-bind-dlq=true
mp.messaging.incoming.video-falhou.dlx.declare=true
mp.messaging.incoming.video-falhou.dead-letter-exchange=notificacao.dlx
mp.messaging.incoming.video-falhou.dead-letter-queue-name=notificacao.dlq
