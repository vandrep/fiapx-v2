quarkus.application.name=fiapx-videos

# Observabilidade (ticket 059). Os tres sinais — log, metrica e trace — saem por OTLP para a
# stack do ticket 058, e SO por OTLP: nao ha stdout em JSON nem coletor lendo `docker logs`.
# O console do container nao muda e nao e desligado: foi `docker logs` que diagnosticou o
# incidente de 06/09, e o cenario em que ele mais importa e justamente aquele em que a stack
# de observabilidade e o que esta quebrado.
#
# Metricas e logs vem DESLIGADOS por default nesta extensao (so trace nasce ligado); os tres
# sinais sao requisito, entao os dois vao explicitos aqui.
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
# always_on, e nao o `parentbased_always_on` default: amostrar destruiria o caso raro que
# motiva a camada inteira, e o volume da demo e trivial. O pico de 400 Videos do overlay de
# carga nao chega a stack — o docker-compose.carga.yml a reduz a zero replicas e cala os
# exportadores dos tres servicos.
quarkus.otel.traces.sampler=always_on
# Sem `depends_on` para a stack, e de proposito: com a observabilidade ausente ou morta o
# exportador falha e reclama, e o ciclo do Video continua inteiro. O passo 11 do
# scripts/smoke.sh derruba o container e prova exatamente isso.
%prod.quarkus.otel.exporter.otlp.endpoint=http://observabilidade:4317
# Testes nao exportam: a suite roda a partir da raiz, sem stack de observabilidade de pe. Em
# %dev o motivo e o mesmo: um `quarkus dev` local nao tem para onde exportar.
#
# O que esta chave faz, medido nos tickets 061 e 062 e ao contrario do que este comentario
# dizia: ela desliga METRICA e LOG de verdade, mas nao o TRACE. O `Tracer` injetado nao vira
# no-op, o span continua gravando e o codigo instrumentado roda pelo caminho de sempre, abrindo
# escopo e MDC. Para a suite isso nao muda nada (o que ela julga e comportamento, nao span), mas
# nao se apoie nesta chave para medir custo de instrumentacao. O mecanismo esta em
# docs/adr/0004-camada-de-observabilidade.md, que e onde ele mora.
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.otel.sdk.disabled=true
quarkus.datasource.db-kind=postgresql

# O acesso ao Postgres abre uma sessao/transacao nova por tentativa. O limite (3 retries,
# espera de 2s) e a classificacao de falhas ficam no adapter, conforme ADR 0001; falhas
# permanentes nao entram no retry.

# O Swagger UI *e* a demo: nao ha outra interface. Por isso ele fica ligado tambem em prod.
quarkus.swagger-ui.always-include=true
# Preenche o client_id do dialogo Authorize; o campo em si fica escondido pelo CSS de
# branding (META-INF/branding/smallrye-open-api-ui.css) — o client e publico e so ha um.
quarkus.swagger-ui.oauth-client-id=fiapx-videos
mp.openapi.extensions.smallrye.info.title=FIAP X — videos
mp.openapi.extensions.smallrye.info.version=0.1.0
mp.openapi.extensions.smallrye.info.description=Borda publica do FIAP X: envio de Video, \
  acompanhamento do estado e download do Pacote de frames. Toda operacao e escopada pelo \
  `sub` do bearer token — nao existe parametro de usuario nesta API.

# Em %prod o script docker/postgres/init.sql e a autoridade, e `validate` e o que impede
# ele de virar documentacao apodrecida: divergir das entidades derruba o servico no boot.
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Teto de upload (ticket 011). O default do Quarkus e 10 MB, o que reprovaria qualquer
# video de verdade. O 413 daqui e cortado pelo Vert.x antes do JAX-RS e nao sai como
# problem+json — inconsistencia assumida no ticket 008.
quarkus.http.limits.max-body-size=200M
# Explicito de proposito: um diretorio temporario implicito de 200 MB por upload e o tipo
# de coisa que ninguem encontra quando o disco enche. Vai sobre o volume `fiapx-uploads`.
%prod.quarkus.http.body.uploads-directory=/var/fiapx/uploads

# O `auth-server-url` so pode existir sob %prod.: declarada sem perfil, ela desliga o Dev
# Services for Keycloak e nenhum @QuarkusTest sobe (ticket 004).
%prod.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/fiapx
# Fonte unica do realm: o mesmo arquivo que o Compose importa e o que o Dev Services sobe
# em @QuarkusTest, entao o teste exercita o realm que vai para a banca.
quarkus.keycloak.devservices.realm-path=../docker/keycloak/realm-export.json
quarkus.oidc.client-id=fiapx-videos
quarkus.oidc.application-type=service

# O scanner do Quarkus gera sozinho um esquema `SecurityScheme` (openIdConnect apontando
# para o issuer, inalcancavel do browser) e o pendura em cada operacao — e requisito por
# operacao sobrescreve o global, entao o Swagger nao anexava o token do esquema abaixo e
# tudo respondia 401. Desligados os dois, vale o unico esquema que o filtro declara.
quarkus.smallrye-openapi.auto-add-security=false
quarkus.smallrye-openapi.auto-add-security-requirement=false

# URL do botao Authorize do Swagger UI. Derivada da config do OIDC em tempo de execucao,
# porque em teste o Dev Services sorteia a porta do Keycloak.
fiapx.openapi.token-url=${quarkus.oidc.auth-server-url}/protocol/openid-connect/token

# Dois buckets, e nao um com prefixos, porque a retencao de 7 dias e declarada por bucket
# no MinIO (ticket 011).
fiapx.armazenamento.bucket-videos=videos
fiapx.armazenamento.bucket-pacotes=pacotes

# MinIO exige path-style: o virtual-host style da AWS pediria DNS por bucket.
quarkus.s3.path-style-access=true
quarkus.s3.async-client.type=netty
%prod.quarkus.s3.endpoint-override=http://minio:9000
%prod.quarkus.s3.aws.region=us-east-1
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}

# O Dev Service da extensao S3 sobe LocalStack, nao MinIO (ticket 005). Basta: o que o
# teste exercita e a API S3, e ela e a mesma.
%test.quarkus.s3.devservices.buckets=videos,pacotes

# O teste do blip exercita a repeticao que hoje vive em onFailure().retry() do Mutiny, dentro
# do ArquivoMinioClient (tickets 048 e 061). Contagem e espera seguem os valores do codigo;
# configuracao do interceptor que saiu nao controla esta cadeia.

# Porta distinta por servico para rodar os tres em dev local.
%dev.quarkus.http.port=8080

# Mensageria (docs/contratos/mensagens.md, ticket 017). Dois exchanges topic; o nome da fila
# e prefixado pelo servico dono (o consumidor). No Compose, o definitions.json
# pre-provisiona a topologia inteira antes dos servicos de negocio; os canais continuam
# declarando tudo para que os Dev Services subam um broker limpo nos testes.
%prod.rabbitmq-host=rabbitmq
%prod.rabbitmq-port=5672
%prod.rabbitmq-username=${RABBITMQ_USERNAME:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Fixado nos Dev Services e no Compose (cartografia do mapa): sem isto os Dev Services
# escolhem sozinhos a imagem management mais recente do momento.
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.3.5-management-alpine

# publish-confirms=true nos DOIS canais de saida, e a marca do ADR 0003 depende disso: com o
# default `false` do conector o Uni do envio completa antes de o broker confirmar, entao
# `marcarComandoPublicado` grava uma marca que pode mentir. Medido no ticket 025: 3 Videos em
# RECEBIDO com comando_publicado_em preenchido e comando nenhum na fila — e a varredura filtra
# por marca nula, logo nunca os reconsidera. Custa um round-trip ao broker por publicacao; e o
# preco de a marca significar o que diz.
mp.messaging.outgoing.extrair-video.connector=smallrye-rabbitmq
mp.messaging.outgoing.extrair-video.exchange.name=fiapx.comandos
mp.messaging.outgoing.extrair-video.exchange.type=topic
mp.messaging.outgoing.extrair-video.default-routing-key=extracao.extrair
mp.messaging.outgoing.extrair-video.publish-confirms=true

mp.messaging.outgoing.video-falhou.connector=smallrye-rabbitmq
mp.messaging.outgoing.video-falhou.exchange.name=fiapx.eventos
mp.messaging.outgoing.video-falhou.exchange.type=topic
mp.messaging.outgoing.video-falhou.default-routing-key=video.falhou
mp.messaging.outgoing.video-falhou.publish-confirms=true

# max-outstanding-messages e obrigatorio e explicito em todo canal de entrada (ticket 003):
# sem ele o conector bufferiza ate 500.000 mensagens em memoria. failure-strategy=requeue
# em vez de fail: fail derrubaria o health check e quebraria o depends_on do Compose
# (ADR 0001). Fila quorum com x-delivery-limit=3, DLQ compartilhada videos.dlq (terminal).
mp.messaging.incoming.extracao-iniciada.connector=smallrye-rabbitmq
mp.messaging.incoming.extracao-iniciada.exchange.name=fiapx.eventos
mp.messaging.incoming.extracao-iniciada.exchange.type=topic
mp.messaging.incoming.extracao-iniciada.queue.name=videos.extracao-iniciada
mp.messaging.incoming.extracao-iniciada.routing-keys=extracao.iniciada
mp.messaging.incoming.extracao-iniciada.max-outstanding-messages=20
mp.messaging.incoming.extracao-iniciada.failure-strategy=requeue
mp.messaging.incoming.extracao-iniciada.queue.x-queue-type=quorum
mp.messaging.incoming.extracao-iniciada.queue.x-delivery-limit=3
mp.messaging.incoming.extracao-iniciada.auto-bind-dlq=true
mp.messaging.incoming.extracao-iniciada.dlx.declare=true
mp.messaging.incoming.extracao-iniciada.dead-letter-exchange=videos.dlx
mp.messaging.incoming.extracao-iniciada.dead-letter-queue-name=videos.dlq

mp.messaging.incoming.extracao-concluida.connector=smallrye-rabbitmq
mp.messaging.incoming.extracao-concluida.exchange.name=fiapx.eventos
mp.messaging.incoming.extracao-concluida.exchange.type=topic
mp.messaging.incoming.extracao-concluida.queue.name=videos.extracao-concluida
mp.messaging.incoming.extracao-concluida.routing-keys=extracao.concluida
mp.messaging.incoming.extracao-concluida.max-outstanding-messages=20
mp.messaging.incoming.extracao-concluida.failure-strategy=requeue
mp.messaging.incoming.extracao-concluida.queue.x-queue-type=quorum
mp.messaging.incoming.extracao-concluida.queue.x-delivery-limit=3
mp.messaging.incoming.extracao-concluida.auto-bind-dlq=true
mp.messaging.incoming.extracao-concluida.dlx.declare=true
mp.messaging.incoming.extracao-concluida.dead-letter-exchange=videos.dlx
mp.messaging.incoming.extracao-concluida.dead-letter-queue-name=videos.dlq

mp.messaging.incoming.extracao-falhou.connector=smallrye-rabbitmq
mp.messaging.incoming.extracao-falhou.exchange.name=fiapx.eventos
mp.messaging.incoming.extracao-falhou.exchange.type=topic
mp.messaging.incoming.extracao-falhou.queue.name=videos.extracao-falhou
mp.messaging.incoming.extracao-falhou.routing-keys=extracao.falhou
mp.messaging.incoming.extracao-falhou.max-outstanding-messages=20
mp.messaging.incoming.extracao-falhou.failure-strategy=requeue
mp.messaging.incoming.extracao-falhou.queue.x-queue-type=quorum
mp.messaging.incoming.extracao-falhou.queue.x-delivery-limit=3
mp.messaging.incoming.extracao-falhou.auto-bind-dlq=true
mp.messaging.incoming.extracao-falhou.dlx.declare=true
mp.messaging.incoming.extracao-falhou.dead-letter-exchange=videos.dlx
mp.messaging.incoming.extracao-falhou.dead-letter-queue-name=videos.dlq
